

<!DOCTYPE html>
<html lang="ht">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PH Joolens Store - Gaming Top Up</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#fbf7ee">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #fbf7ee;
            color: #1e293b;
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
        }
        .container {
            max-width: 480px;
            width: 100%;
            background-color: #ffffff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            border: 1px solid #e2d9c2;
        }
        h2 { 
            text-align: center; 
            color: #27272a; 
            margin-bottom: 5px;
            font-size: 22px;
        }
        .subtitle {
            text-align: center;
            font-size: 13px;
            color: #64748b;
            margin-bottom: 20px;
        }
        .install-btn {
            display: none;
            width: 100%;
            background-color: #10b981;
            color: white;
            padding: 10px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            margin-bottom: 20px;
        }
        .catalog-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }
        .game-card {
            background-color: #f8fafc;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            padding: 15px 10px;
            text-align: center;
            cursor: pointer;
            transition: 0.2s;
        }
        .game-card:hover {
            border-color: #d97706;
            background-color: #fffbeb;
            transform: translateY(-2px);
        }
        .game-card h3 {
            font-size: 15px;
            margin: 8px 0 4px 0;
            color: #1e293b;
        }
        .game-card p {
            font-size: 11px;
            color: #64748b;
            margin: 0;
        }
        .form-section {
            display: none;
            background: #f8fafc;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #e2d9c2;
            margin-top: 15px;
        }
        .form-group { 
            margin-bottom: 15px; 
        }
        label { 
            display: block; 
            margin-bottom: 6px; 
            font-weight: bold; 
            font-size: 13px;
            color: #334155;
        }
        input, select {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #cbd5e1;
            background-color: #ffffff;
            color: #0f172a;
            box-sizing: border-box;
            font-size: 13px;
            outline: none;
        }
        input:focus, select:focus {
            border-color: #d97706;
        }
        /* Estil pou ti bouton pakè yo an griy (menm jan ak imaj la) */
        .packages-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            max-height: 220px;
            overflow-y: auto;
            padding: 2px;
        }
        .pkg-btn {
            background-color: #ffffff;
            border: 1px solid #cbd5e1;
            padding: 10px 4px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            color: #334155;
            transition: 0.2s;
        }
        .pkg-btn:hover {
            border-color: #d97706;
            background-color: #fffbeb;
        }
        .pkg-btn.active {
            background-color: #d97706;
            color: white;
            border-color: #b45309;
        }
        .back-btn {
            background: none;
            border: none;
            color: #d97706;
            font-weight: bold;
            cursor: pointer;
            font-size: 13px;
            margin-bottom: 10px;
            padding: 0;
        }
        .submit-btn {
            width: 100%;
            padding: 14px;
            background-color: #d97706;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 5px;
        }
        .submit-btn:hover { 
            background-color: #b45309; 
        }
    </style>
</head>
<body>

<div class="container">
    <h2>PH Joolens Store 🎮</h2>
    <div class="subtitle">Katalòg Top-Up Otomatik & Manuel</div>

    <button id="installBtn" class="install-btn">📲 Mete App a sou ekran telefòn ou</button>

    <!-- LISTE JWÈT YO -->
    <div id="catalogView">
        <div class="catalog-grid">
            <div class="game-card" onclick="openGameForm('Free Fire')">
                <span style="font-size: 28px;">🔥</span>
                <h3>Free Fire</h3>
                <p>Top-up & Pass</p>
            </div>
            <div class="game-card" onclick="openGameForm('Pubg Mobile')">
                <span style="font-size: 28px;">🎯</span>
                <h3>Pubg Mobile</h3>
                <p>UC & Pass</p>
            </div>
            <div class="game-card" onclick="openGameForm('Blood Strike')">
                <span style="font-size: 28px;">⚔️</span>
                <h3>Blood Strike</h3>
                <p>Gold & Pass</p>
            </div>
            <div class="game-card" onclick="openGameForm('Flex City')">
                <span style="font-size: 28px;">🏎️</span>
                <h3>Flex City</h3>
                <p>Diamants & Pass</p>
            </div>
        </div>
    </div>

    <!-- FÒM KÒMAND LAN -->
    <div id="formSection" class="form-section">
        <button class="back-btn" onclick="goBackToCatalog()">← Retounen nan Katagòi</button>
        <h3 id="formTitle" style="margin-top: 5px; font-size: 16px; color: #d97706;">Kòmande</h3>

        <form id="orderForm">
            <div class="form-group">
                <label>Chwazi Pake a:</label>
                <div id="packagesGrid" class="packages-grid">
                    <!-- Ti bouton pakè yo pral parèt isit la otomatikman -->
                </div>
                <input type="text" id="selectedPackage" placeholder="Klike sou yon pake anwo a..." required readonly style="margin-top: 8px; background: #f1f5f9;">
            </div>

            <div class="form-group">
                <label for="playerId">ID Jwèt / Kont:</label>
                <input type="text" id="playerId" placeholder="Antre ID ou a" required>
            </div>

            <div class="form-group">
                <label for="paymentMethod">Metòd Peman:</label>
                <select id="paymentMethod" required>
                    <option value="MonCash">MonCash</option>
                    <option value="Natcash">Natcash</option>
                </select>
            </div>

            <div class="form-group">
                <label for="senderPhone">Nimewo ki voye peman an:</label>
                <input type="tel" id="senderPhone" placeholder="Antre nimewo ou voye l la" required>
            </div>

            <button type="button" class="submit-btn" onclick="sendOrder()">Voye Kòmand lan sou WhatsApp</button>
        </form>
    </div>
</div>

<script>
    // Lis pakè yo pou chak jwèt
    const gamePackages = {
        "Free Fire": [
            "110 💎", "220 💎", "341 💎", "451 💎", 
            "572 💎", "682 💎", "792 💎", "913 💎", 
            "1166 💎", "2398 💎", "3564 💎", "6160 💎", 
            "12260 💎", "Booyah pass", "Semèn", "Mwa", "Super Vip"
        ],
        "Pubg Mobile": [
            "60 UC (180g)", "325 UC (875g)", "660 UC (1600g)", 
            "1800 UC (3500g)", "3850 UC (8000g)", "8100 UC (16900g)", "16200 UC (33000g)"
        ],
        "Blood Strike": [
            "51 Gold (76g)", "105 Gold (125g)", "320 Gold (400g)", 
            "540 Gold (700g)", "1100 Gold (1450g)", "2260 Gold (2850g)", 
            "5800 Gold (7250g)", "Lucky bag", "Season pass", "Level Up pass", 
            "Strike Elite", "Strike Premium", "Cornucopia"
        ],
        "Flex City": [
            "340 💎", "520 💎 (2050g)", "1166 💎 (5100g)", 
            "2330 💎 (10000g)", "4760 💎 (10700g)", "12320 💎 (20400g)", 
            "Level Up", "Flex pass", "Flex pass +"
        ]
    };

    let currentGame = "";

    function openGameForm(gameName) {
        currentGame = gameName;
        document.getElementById('catalogView').style.display = 'none';
        document.getElementById('formSection').style.display = 'block';
        document.getElementById('formTitle').innerText = 'Kòmande pou: ' + gameName;
        document.getElementById('selectedPackage').value = "";
        document.getElementById('playerId').value = "";
        document.getElementById('senderPhone').value = "";

        let gridContainer = document.getElementById('packagesGrid');
        gridContainer.innerHTML = '';

        if(gamePackages[gameName]) {
            gamePackages[gameName].forEach(pkg => {
                let btn = document.createElement('div');
                btn.className = 'pkg-btn';
                btn.innerText = pkg;
                btn.onclick = function() {
                    // Retire klas active nan tout lòt bouton yo
                    let allBtns = gridContainer.querySelectorAll('.pkg-btn');
                    allBtns.forEach(b => b.classList.remove('active'));
                    
                    // Mete klas active sou sa klike a
                    btn.classList.add('active');
                    document.getElementById('selectedPackage').value = pkg;
                };
                gridContainer.appendChild(btn);
            });
        }
    }

    function goBackToCatalog() {
        document.getElementById('formSection').style.display = 'none';
        document.getElementById('catalogView').style.display = 'block';
    }

    function sendOrder() {
        const pkg = document.getElementById('selectedPackage').value;
        const id = document.getElementById('playerId').value;
        const method = document.getElementById('paymentMethod').value;
        const phone = document.getElementById('senderPhone').value;

        if(!currentGame || !pkg || !id || !phone) {
            alert('Tanpri chwazi yon pake epi ranpli tout enfòmasyon yo anvan ou voye l!');
            return;
        }

        const myPhone = "50932265636"; 
        const text = `Bonjou PH Joolens Store, mwen fè yon kòmand:%0A- *Jwèt:* ${currentGame}%0A- *Pake:* ${pkg}%0A- *ID Jwèt:* ${id}%0A- *Metòd:* ${method}%0A- *Nimewo Peman:* ${phone}`;

        window.open(`https://api.whatsapp.com/send?phone=${myPhone}&text=${text}`, '_blank');
    }

    let deferredPrompt;
    const installBtn = document.getElementById('installBtn');

    window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        installBtn.style.display = 'block';

        installBtn.addEventListener('click', () => {
            installBtn.style.display = 'none';
            deferredPrompt.prompt();
            deferredPrompt.choiceResult.then((choiceResult) => {
                deferredPrompt = null;
            });
        });
    });
</script>

</body>
</html>
