<!DOCTYPE html>
<html lang="ht">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PHJoolens Store</title>

<style>
:root{
--gold:#d99a16;
--gold2:#efbd4b;
--dark:#14213d;
--gray:#687080;
--bg:#f7f8fa;
--green:#25d366;
--red:#e74c3c;
}

*{box-sizing:border-box}

html{scroll-behavior:smooth}

body{
margin:0;
padding-bottom:90px;
font-family:Segoe UI,Tahoma,Arial,sans-serif;
background:var(--bg);
color:#222;
}

/* LOGIN */
#login-modal{
position:fixed;
inset:0;
background:rgba(0,0,0,.75);
display:flex;
align-items:center;
justify-content:center;
z-index:9999;
padding:20px;
}

.login-box{
background:white;
width:100%;
max-width:410px;
padding:30px 24px;
border-radius:20px;
text-align:center;
box-shadow:0 15px 50px rgba(0,0,0,.25);
}

.login-logo{font-size:42px}

.login-box h2{
margin:5px 0 10px;
color:var(--dark);
}

.login-box p{
color:var(--gray);
line-height:1.5;
}

.login-box input{
width:100%;
padding:14px;
margin:10px 0;
border:1px solid #ddd;
border-radius:10px;
font-size:16px;
outline:none;
}

.login-box input:focus{border-color:var(--gold)}

.login-box button{
width:100%;
padding:14px;
border:0;
border-radius:10px;
background:linear-gradient(135deg,var(--gold),var(--gold2));
color:white;
font-weight:800;
font-size:16px;
cursor:pointer;
}

/* HEADER */
header{
position:sticky;
top:0;
z-index:1000;
background:white;
padding:13px 15px;
display:flex;
align-items:center;
justify-content:space-between;
gap:10px;
box-shadow:0 2px 10px rgba(0,0,0,.08);
}

.logo{
font-size:18px;
font-weight:900;
color:var(--dark);
}

.wallet{
background:#fff4d6;
color:#9a6b00;
padding:8px 12px;
border-radius:20px;
font-weight:800;
white-space:nowrap;
}

.logout{
background:var(--red);
color:white;
border:0;
padding:8px 11px;
border-radius:8px;
font-weight:700;
cursor:pointer;
}

/* MAIN */
.container{
width:100%;
max-width:900px;
margin:0 auto;
padding:22px 15px;
}

.main-title{
text-align:center;
margin:5px 0;
color:var(--dark);
font-size:30px;
}

.subtitle{
text-align:center;
color:var(--gray);
margin-bottom:20px;
}

/* BONUS */
.bonus-wrapper{
margin-bottom:18px;
}
