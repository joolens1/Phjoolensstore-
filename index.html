
<!DOCTYPE html>
<html lang="ht">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PH Joolens Store - Gaming Top Up</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#fbf7ee">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #fbf7ee;
            color: #1e293b;
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
        }
        .container {
            max-width: 450px;
            width: 100%;
            background-color: #ffffff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            border: 1px solid #e2d9c2;
        }
        h2 { 
            text-align: center; 
            color: #27272a; 
            margin-bottom: 5px;
            font-size: 22px;
        }
        .subtitle {
            text-align: center;
            font-size: 13px;
            color: #64748b;
            margin-bottom: 20px;
        }
        .install-btn {
            display: none;
            width: 100%;
            background-color: #10b981;
            color: white;
            padding: 10px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            margin-bottom: 20px;
        }
        .form-group { 
            margin-bottom: 15px; 
        }
        label { 
            display: block; 
            margin-bottom: 6px; 
            font-weight: bold; 
            font-size: 14px;
            color: #334155;
        }
        input, select {
            width: 100%;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #cbd5e1;
            background-color: #f8fafc;
            color: #0f172a;
            box-sizing: border-box;
            font-size: 14px;
            outline: none;
        }
        input:focus, select:focus {
            border-color: #d97706;
        }
        .games-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 15px;
        }
        .game-btn {
            background-color: #f8fafc;
            border: 1px solid #cbd5e1;
            padding: 10px 5px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            color: #334155;
            transition: 0.2s;
        }
        .game-btn:hover {
            border-color: #d97706;
            background-color: #fffbeb;
        }
        .game-btn.active {
            background-color: #d97706;
            color: white;
            border-color: #b45309;
        }
        .submit-btn {
            width: 100%;
            padding: 14px;
            background-color: #d97706;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 10px;
        }
        .submit-btn:hover { 
            background-color: #b45309; 
        }
    </style>
</head>
<body>

<div class="container">
    <h2>PH Joolens Store 🎮</h2>
    <div class="subtitle">Top-Up Otomatik & San Pwoblèm</div>

    <button id="installBtn" class="install-btn">📲 Mete App a sou ekran telefòn ou</button>

    <form id="orderForm">
        <div class="form-group">
            <label>Chwazi Jwèt la:</label>
            <div class="games-grid">
                <div class="game-btn" onclick="changeGame('Pubg')">🎯 Pubg</div>
                <div class="game-btn" onclick="changeGame('Blood')">⚔️ Blood</div>
                <div class="game-btn" onclick="changeGame('Flex')">🔥 Flex</div>
            </div>
            <input type="text" id="selectedGame" placeholder="Chwazi yon jwèt anwo a..." required readonly>
        </div>

        <div class="form-group">
            <label for="playerId">ID Jwèt / Kont:</label>
            <input type="text" id="playerId" placeholder="Antre ID ou a" required>
        </div>

        <div class="form-group">
            <label for="packageSelect">Chwazi Pake / Pri:</label>
            <select id="packageSelect" required>
                <option value="">-- Premye chwazi yon jwèt anwo a --</option>
            </select>
        </div>

        <div class="form-group">
            <label for="paymentMethod">Metòd Peman:</label>
            <select id="paymentMethod" required>
                <option value="MonCash">MonCash</option>
                <option value="Natcash">Natcash</option>
            </select>
        </div>

        <div class="form-group">
            <label for="senderPhone">Nimewo ki voye peman an:</label>
            <input type="tel" id="senderPhone" placeholder="Antre nimewo ou voye l la" required>
        </div>

        <button type="button" class="submit-btn" onclick="sendOrder()">Voye Kòmand lan sou WhatsApp</button>
    </form>
</div>

<script>
    // Done pakè ak pri dapre imaj ou voye yo
    const gamePackages = {
        "Pubg": [
            "60 UC - 180g",
            "325 UC - 875g",
            "660 UC - 1600g",
            "1800 UC - 3500g",
            "3850 UC - 8000g",
            "8100 UC - 16900g",
            "16200 UC - 33000g"
        ],
        "Blood": [
            "51 - 76g",
            "105 - 125g",
            "320 - 400g",
            "540 - 700g",
            "1100 - 1450g",
            "2260 - 2850g",
            "5800 - 7250g",
            "Lucky bag - 155g",
            "Season pass - 150g",
            "Level Up pass - 310g",
            "Strike pass Elite - 600g",
            "Strike pass premium - 1300g",
            "Cornucopia - 295g"
        ],
        "Flex": [
            "340 Diamants",
            "520 Diamants - 2050g",
            "1166 Diamants - 5100g",
            "2330 Diamants - 10000g",
            "4760 Diamants - 10700g",
            "12320 Diamants - 20400g",
            "2310 - 750g",
            "6875 - 2050g",
            "18700 - 5100g",
            "Level Up - 1000g",
            "Flex pass - 535g",
            "Flex pass plus - 700g"
        ]
    };

    function changeGame(gameName) {
        document.getElementById('selectedGame').value = gameName;
        
        // Mete style aktif sou bouton an
        let buttons = document.querySelectorAll('.game-btn');
        buttons.forEach(btn => {
            btn.classList.remove('active');
            if(btn.innerText.includes(gameName)) {
                btn.classList.add('active');
            }
        });

        // Ranpli lis pakè yo dapre jwèt la chwazi a
        let pkgSelect = document.getElementById('packageSelect');
        pkgSelect.innerHTML = '<option value="">-- Chwazi yon pake --</option>';
        
        if(gamePackages[gameName]) {
            gamePackages[gameName].forEach(pkg => {
                let opt = document.createElement('option');
                opt.value = pkg;
                opt.innerText = pkg;
                pkgSelect.appendChild(opt);
            });
        }
    }

    function sendOrder() {
        const game = document.getElementById('selectedGame').value;
        const id = document.getElementById('playerId').value;
        const pkg = document.getElementById('packageSelect').value;
        const method = document.getElementById('paymentMethod').value;
        const phone = document.getElementById('senderPhone').value;

        if(!game || !id || !pkg || !phone) {
            alert('Tanpri ranpli tout enfòmasyon yo anvan ou voye l!');
            return;
        }

        const myPhone = "50932265636"; 
        const text = `Bonjou PH Joolens Store, mwen fè yon kòmand:%0A- *Jwèt:* ${game}%0A- *ID Jwèt:* ${id}%0A- *Pake:* ${pkg}%0A- *Metòd:* ${method}%0A- *Nimewo Peman:* ${phone}`;

        window.open(`https://api.whatsapp.com/send?phone=${myPhone}&text=${text}`, '_blank');
    }

    let deferredPrompt;
    const installBtn = document.getElementById('installBtn');

    window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        installBtn.style.display = 'block';

        installBtn.addEventListener('click', () => {
            installBtn.style.display = 'none';
            deferredPrompt.prompt();
            deferredPrompt.choiceResult.then((choiceResult) => {
                deferredPrompt = null;
            });
        });
    });
</script>

</body>
</html>
