

<!DOCTYPE html>
<html lang="ht">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PH Joolens Store - Free Fire Top Up</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#fbf7ee">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #fbf7ee;
            color: #1e293b;
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
        }
        .container {
            max-width: 450px;
            width: 100%;
            background-color: #ffffff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            border: 1px solid #e2d9c2;
        }
        h2 { 
            text-align: center; 
            color: #27272a; 
            margin-bottom: 5px;
            font-size: 22px;
        }
        .subtitle {
            text-align: center;
            font-size: 13px;
            color: #64748b;
            margin-bottom: 20px;
        }
        .install-btn {
            display: none;
            width: 100%;
            background-color: #10b981;
            color: white;
            padding: 10px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            margin-bottom: 20px;
        }
        .form-group { 
            margin-bottom: 15px; 
        }
        label { 
            display: block; 
            margin-bottom: 6px; 
            font-weight: bold; 
            font-size: 14px;
            color: #334155;
        }
        input, select {
            width: 100%;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #cbd5e1;
            background-color: #f8fafc;
            color: #0f172a;
            box-sizing: border-box;
            font-size: 14px;
            outline: none;
        }
        input:focus, select:focus {
            border-color: #d97706;
        }
        .packages-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 15px;
        }
        .pkg-btn {
            background-color: #f8fafc;
            border: 1px solid #cbd5e1;
            padding: 10px 5px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            color: #334155;
            transition: 0.2s;
        }
        .pkg-btn:hover {
            border-color: #d97706;
            background-color: #fffbeb;
        }
        .pkg-btn.active {
            background-color: #d97706;
            color: white;
            border-color: #b45309;
        }
        .submit-btn {
            width: 100%;
            padding: 14px;
            background-color: #d97706;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 10px;
        }
        .submit-btn:hover { 
            background-color: #b45309; 
        }
    </style>
</head>
<body>

<div class="container">
    <h2>PH Joolens Store 🎮</h2>
    <div class="subtitle">Free Fire Top-Up Otomatik & San Pwoblèm</div>

    <button id="installBtn" class="install-btn">📲 Mete App a sou ekran telefòn ou</button>

    <form id="orderForm">
        <div class="form-group">
            <label for="playerId">ID Jouè Free Fire:</label>
            <input type="number" id="playerId" placeholder="Eg: 123456789" required>
        </div>

        <div class="form-group">
            <label>Chwazi Pake Djamon:</label>
            <div class="packages-grid">
                <div class="pkg-btn" onclick="selectPackage('110 Diamants', this)">110 💎</div>
                <div class="pkg-btn" onclick="selectPackage('341 Diamants', this)">341 💎</div>
                <div class="pkg-btn" onclick="selectPackage('572 Diamants', this)">572 💎</div>
                <div class="pkg-btn" onclick="selectPackage('Abonnement Hebdomadaire', this)">Semèn</div>
                <div class="pkg-btn" onclick="selectPackage('Abonnement Mensuel', this)">Mwa</div>
                <div class="pkg-btn" onclick="selectPackage('Booyah Pass', this)">Booyah</div>
            </div>
            <input type="text" id="package" placeholder="Oswa chwazi anwo a..." required readonly>
        </div>

        <div class="form-group">
            <label for="paymentMethod">Metòd Peman:</label>
            <select id="paymentMethod" required>
                <option value="MonCash">MonCash</option>
                <option value="Natcash">Natcash</option>
            </select>
        </div>

        <div class="form-group">
            <label for="senderPhone">Nimewo ki voye peman an:</label>
            <input type="tel" id="senderPhone" placeholder="Antre nimewo ou voye l la" required>
        </div>

        <button type="button" class="submit-btn" onclick="sendOrder()">Voye Kòmand lan sou WhatsApp</button>
    </form>
</div>

<script>
    function selectPackage(pkgName, element) {
        document.getElementById('package').value = pkgName;
        let buttons = document.querySelectorAll('.pkg-btn');
        buttons.forEach(btn => btn.classList.remove('active'));
        element.classList.add('active');
    }

    function sendOrder() {
        const id = document.getElementById('playerId').value;
        const pkg = document.getElementById('package').value;
        const method = document.getElementById('paymentMethod').value;
        const phone = document.getElementById('senderPhone').value;

        if(!id || !pkg || !phone) {
            alert('Tanpri ranpli ID w, chwazi yon pake, epi antre nimewo peman w!');
            return;
        }

        const myPhone = "50932265636"; // Bon nimewo w la kòrèk kounye a
        const text = `Bonjou PH Joolens Store, mwen fè yon kòmand:%0A- *ID Jouè:* ${id}%0A- *Pake:* ${pkg}%0A- *Metòd:* ${method}%0A- *Nimewo Peman:* ${phone}`;

        window.open(`https://api.whatsapp.com/send?phone=${myPhone}&text=${text}`, '_blank');
    }

    let deferredPrompt;
    const installBtn = document.getElementById('installBtn');

    window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        installBtn.style.display = 'block';

        installBtn.addEventListener('click', () => {
            installBtn.style.display = 'none';
            deferredPrompt.prompt();
            deferredPrompt.choiceResult.then((choiceResult) => {
                deferredPrompt = null;
            });
        });
    });
</script>

</body>
</html>
