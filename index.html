<!DOCTYPE html>
<html lang="ht">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#030918">
<title>PH JOOLENS STORE</title>

<style>
:root {
  --gold:#ffca28;
  --gold2:#ff9900;
  --bg:#030918;
  --card:#0b1429;
  --text:#ffffff;
  --muted:#b5bfd5;
  --border:#34405b;
  --blue:#168cff;
}

* { box-sizing:border-box; }
html { scroll-behavior:smooth; }

body {
  margin:0;
  padding-bottom:95px;
  color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
  background:
    radial-gradient(ellipse at 50% 15%,#102e5d 0,transparent 42%),
    linear-gradient(180deg,#020611 0%,#06132e 45%,#020611 100%);
  background-attachment:fixed;
}

button,input,select,textarea { font:inherit; }
button { cursor:pointer; }

.container {
  max-width:1000px;
  margin:auto;
  padding:12px;
}

.hidden { display:none!important; }

header {
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  padding:8px 0 15px;
  flex-wrap:wrap;
}

.brand {
  display:flex;
  align-items:center;
  gap:8px;
}

.logo {
  font-size:clamp(38px,8vw,62px);
  filter:drop-shadow(0 0 8px #ffbb22);
}

.brand-name {
  color:var(--gold);
  font-size:clamp(18px,4vw,30px);
  font-weight:900;
  letter-spacing:1px;
}

.brand-sub {
  text-align:center;
  letter-spacing:7px;
  font-size:12px;
  margin-top:2px;
}

.header-actions {
  display:flex;
  gap:6px;
}

.icon-btn {
  background:#09142a;
  border:1px solid #6c5525;
  border-radius:50%;
  width:40px;
  height:40px;
  color:var(--gold);
  font-size:20px;
}

.trust-strip {
  display:flex;
  margin:4px 0 16px;
  border:1px solid #9c781c;
  border-radius:30px;
  background:#071126c9;
  overflow:hidden;
}

.trust-strip>div {
  flex:1;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  padding:9px 5px;
  border-right:1px solid #39405a;
  flex-direction:column;
  font-size:12px;
}

.trust-strip>div:last-child { border:0; }
.trust-strip b { font-size:22px;color:var(--gold); }
.trust-strip span { color:#f2f4fa; }

.game-marquee {
  display:flex;
  align-items:center;
  justify-content:space-around;
  gap:14px;
  flex-wrap:wrap;
  margin:10px 0 18px;
  padding:8px 0;
  color:#e8edf9;
  font-weight:900;
  font-size:clamp(10px,2.4vw,17px);
  text-align:center;
}

.game-marquee span:nth-child(2),
.game-marquee span:nth-child(3) {
  color:var(--gold);
}

.game-marquee small {
  display:block;
  font-size:9px;
  letter-spacing:2px;
}

.search-box {
  display:flex;
  align-items:center;
  gap:10px;
  border-radius:20px;
  padding:0 16px;
  background:#0a1833;
  border:1px solid #41587f;
  margin-bottom:20px;
}

.search-box input {
  width:100%;
  min-width:0;
  padding:16px 0;
  color:white;
  background:transparent;
  border:0;
  outline:0;
  font-size:15px;
}

.search-box input::placeholder { color:#9daac1; }
.search-box span { font-size:28px;color:#aab8d2; }

.hero {
  position:relative;
  overflow:hidden;
  min-height:160px;
  display:flex;
  align-items:center;
  padding:20px;
  border:1px solid #d6a92d;
  border-radius:18px;
  background:
    linear-gradient(125deg,#ffbd17 0%,#101d3b 17%,#06112b 40%,#06112b 72%,#ffb900 100%);
  box-shadow:0 0 25px #ffb00016;
}

.hero:after {
  content:'♛';
  position:absolute;
  right:5%;
  bottom:-25px;
  font-size:115px;
  color:var(--gold);
  opacity:.13;
}

.hero-content {
  position:relative;
  z-index:1;
  max-width:650px;
}

.hero h1 {
  margin:0 0 8px;
  font-size:clamp(22px,5vw,34px);
  line-height:1.15;
}

.hero h1 span { color:var(--gold); }

.hero p,.notice {
  color:var(--muted);
  font-size:13px;
  line-height:1.5;
}

.gold-btn {
  background:linear-gradient(135deg,#ffe36b,#ffad08);
  color:#15100a;
  font-weight:900;
  border:0;
  border-radius:24px;
  padding:11px 18px;
  font-size:13px;
}

.section-heading {
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  margin:24px 4px 12px;
}

.section-heading h2 {
  margin:0;
  font-size:clamp(18px,4.5vw,24px);
}

.section-heading button {
  background:none;
  border:0;
  color:var(--gold);
  font-size:22px;
}

.gold-line {
  width:90px;
  height:3px;
  background:linear-gradient(90deg,#ffb400,transparent);
  margin:6px 0 14px 4px;
}

.games-grid {
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:12px;
}

.game-card {
  min-width:0;
  border:1px solid #1f4b8b;
  border-radius:17px;
  overflow:hidden;
  background:linear-gradient(145deg,#0c1b39,#030a19);
  box-shadow:0 5px 15px #0003;
}

.game-card.gold { border-bottom:3px solid var(--gold); }
.game-card.blue { border-bottom:3px solid var(--blue); }

.game-art {
  min-height:90px;
  aspect-ratio:1.6/1;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:42px;
  background:radial-gradient(circle at 50% 20%,#1e3b69,#09142b 72%);
}

.game-card[data-search*="free fire"] .game-art {
  background:radial-gradient(circle at 25% 30%,#ffb32c,#9b3215 35%,#08152e 78%);
}

.game-card[data-search*="pubg"] .game-art {
  background:radial-gradient(circle at 70% 30%,#ffca55,#61462c 34%,#08152e 78%);
}

.game-card[data-search*="mobile legends"] .game-art {
  background:radial-gradient(circle at 65% 20%,#347bff,#58236f 40%,#08152e 80%);
}

.game-card[data-search*="call of duty"] .game-art {
  background:radial-gradient(circle at 35% 20%,#a7c6c7,#394b4c 38%,#07101e 80%);
}

.game-card[data-search*="delta force"] .game-art {
  background:radial-gradient(circle at 65% 30%,#37d8a4,#214e48 35%,#07101e 80%);
}

.game-card[data-search*="efootball"] .game-art {
  background:radial-gradient(circle at 70% 20%,#277cff,#18145d 42%,#07101e 80%);
}

.game-info { padding:12px; }

.game-title {
  font-size:15px;
  font-weight:900;
  margin-bottom:5px;
}

.game-footer {
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:4px;
}

.game-desc {
  color:var(--muted);
  font-size:11px;
}

.round-btn {
  flex-shrink:0;
  border:1px solid var(--gold);
  background:#0a1020;
  color:var(--gold);
  width:30px;
  height:30px;
  border-radius:50%;
  font-size:18px;
}

.empty-message {
  display:none;
  text-align:center;
  color:var(--muted);
  padding:20px;
}

.panel,.bonus-card {
  background:linear-gradient(145deg,#0d1c39,#040a18);
  border:1px solid #274b83;
  border-radius:16px;
  padding:14px;
  margin-top:14px;
}

.panel h3 { color:var(--gold); }

.bonus-grid {
  display:grid;
  grid-template-columns:1fr;
  gap:12px;
}

.bonus-card { border-color:#94701c; }

.bonus-tag,.bonus-reward {
  color:var(--gold);
  font-weight:bold;
}

.bonus-reward {
  font-size:14px;
  margin:8px 0;
}

.bonus-card p {
  font-size:12px;
  color:var(--muted);
}

.progress {
  height:8px;
  background:#283249;
  border-radius:8px;
  overflow:hidden;
  margin:8px 0;
}

.progress div {
  height:100%;
  width:0;
  background:linear-gradient(90deg,#ff9900,#ffe36b);
}

.small-btn {
  border:1px solid var(--gold);
  background:transparent;
  color:var(--gold);
  border-radius:8px;
  padding:8px 10px;
  font-size:12px;
}

.full-btn { width:100%;margin-top:8px; }

.packages {
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:9px;
}

.package {
  border:1px solid #253653;
  border-radius:14px;
  padding:12px 10px;
  background:linear-gradient(145deg,#0e1b34,#050c1c);
  min-width:0;
}

.package strong {
  display:block;
  margin-bottom:9px;
  font-size:13px;
  line-height:1.4;
}

.package .price {
  color:#91d9e3;
  font-weight:bold;
  margin-bottom:10px;
  font-size:13px;
}

.package button {
  width:100%;
  border:0;
  background:linear-gradient(135deg,#ffe36b,#ffad08);
  padding:8px;
  border-radius:8px;
  font-weight:bold;
  font-size:12px;
}

.field { margin:10px 0; }

.field label {
  display:block;
  color:var(--muted);
  font-size:12px;
  margin-bottom:5px;
}

.field input,.field select,.field textarea {
  width:100%;
  padding:11px;
  border:1px solid #43516c;
  border-radius:9px;
  background:#050b18;
  color:white;
  font-size:13px;
}

.bottom-nav {
  position:fixed;
  z-index:20;
  left:8px;
  right:8px;
  bottom:6px;
  max-width:980px;
  margin:auto;
  display:grid;
  grid-template-columns:repeat(6,minmax(0,1fr));
  background:#071126ed;
  border:1px solid #66552f;
  border-radius:38px;
  padding:10px 4px;
  box-shadow:0 0 24px #0009;
}

.nav-item {
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:4px;
  border:0;
  color:#b8c1d7;
  background:none;
  font-size:10px;
  font-weight:bold;
  padding:4px 0;
  min-width:0;
}

.nav-icon { font-size:20px; }
.nav-item.active { color:var(--gold); }

.modal {
  position:fixed;
  inset:0;
  z-index:50;
  display:none;
  align-items:center;
  justify-content:center;
  padding:14px;
  background:#000d;
}

.modal.show { display:flex; }

.modal-box {
  width:100%;
  max-width:420px;
  max-height:85vh;
  overflow:auto;
  border:1px solid var(--gold);
  border-radius:18px;
  background:#0a1326;
  padding:18px;
}

.modal-box h2 {
  color:var(--gold);
  margin-top:0;
  font-size:18px;
}

.close-btn {
  float:right;
  background:none;
  border:0;
  color:white;
  font-size:22px;
}

.order-item {
  padding:10px 0;
  border-bottom:1px solid #303b52;
  font-size:13px;
  overflow-wrap:anywhere;
}

body.light {
  --bg:#f1f4fa;
  --card:#fff;
  --text:#10182a;
  --muted:#5b6475;
  --border:#c6ccda;
  background:#f1f4fa;
  color:#10182a;
}

body.light .game-card,
body.light .package,
body.light .panel,
body.light .bonus-card,
body.light .bottom-nav {
  background:#fff;
  color:#10182a;
}

body.light .game-title { color:#10182a; }
body.light .nav-item { color:#4b5563; }
body.light .nav-item.active { color:#b87900; }

@media(min-width:600px) {
  .games-grid { grid-template-columns:repeat(3,minmax(0,1fr)); }
  .packages { grid-template-columns:repeat(3,minmax(0,1fr)); }
  .bonus-grid { grid-template-columns:1fr 1fr; }
}

@media(min-width:900px) {
  .games-grid { grid-template-columns:repeat(4,minmax(0,1fr)); }
}

@media(max-width:420px) {
  .container { padding:10px; }
  .brand-name { font-size:20px; }
  .logo { font-size:38px; }
}
</style>
</head>
<body>
<div class="container">
