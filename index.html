<!-- Bouton pou enstalasyon an -->
<button id="installBtn" style="display: none; background: #22c55e; color: white; padding: 10px 15px; border: none; border-radius: 8px; font-weight: bold; margin: 10px auto; cursor: pointer;">
  📲 Mete App a sou telefòn ou
</button>

<script>
  let deferredPrompt;
  const installBtn = document.getElementById('installBtn');

  window.addEventListener('beforeinstallprompt', (e) => {
    // Anpeche Chrome afiche banner otomatik la imedyatman
    e.preventDefault();
    deferredPrompt = e;
    // Montre bouton pa ou a
    installBtn.style.display = 'block';

    installBtn.addEventListener('click', () => {
      // Kache bouton an
      installBtn.style.display = 'none';
      // Montre envit enstalasyon an
      deferredPrompt.prompt();
      deferredPrompt.choiceResult.then((choiceResult) => {
        if (choiceResult.outcome === 'accepted') {
          console.log('Itilizatè a aksepte ajoute App a');
        }
        deferredPrompt = null;
      });
    });
  });
</script>
