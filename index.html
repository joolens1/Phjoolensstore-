<!DOCTYPE html>
<html lang="ht">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#030918">
<title>PH JOOLENS STORE</title>
<style>
:root{--gold:#ffca28;--gold2:#ff9900;--bg:#030918;--card:#0b1429;--text:#fff;--muted:#b5bfd5;--border:#34405b;--blue:#168cff}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;padding-bottom:95px;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.container{max-width:1000px;margin:auto;padding:12px}
.hidden{display:none!important}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 0 15px}
.brand{display:flex;align-items:center;gap:8px}
.logo{font-size:32px;filter:drop-shadow(0 0 6px #ffbb22)}
.brand-name{color:var(--gold);font-size:clamp(16px,4vw,24px);font-weight:900;letter-spacing:1px}
.brand-sub{text-align:center;letter-spacing:5px;font-size:10px;margin-top:2px}
.header-actions{display:flex;gap:6px}
.icon-btn{background:none;border:0;color:white;font-size:20px;padding:4px}
.search-box{display:flex;align-items:center;gap:10px;background:#0b1426;border:1px solid #63718c;border-radius:14px;padding:0 14px;margin-bottom:18px}
.search-box span{font-size:20px;color:#aab8d2}
.search-box input{width:100%;min-width:0;padding:12px 0;color:white;background:transparent;border:0;outline:none;font-size:15px}
.search-box input::placeholder{color:#9daac1}
.hero{position:relative;overflow:hidden;min-height:200px;display:flex;align-items:center;padding:18px;border:2px solid var(--gold);border-radius:18px;background:radial-gradient(ellipse at 85% 50%,#79500d55,transparent 42%),linear-gradient(125deg,#161b27,#030713 65%,#34230a);box-shadow:0 0 15px #ffb00033}
.hero:after{content:"💎 🎮 🎁";position:absolute;right:8px;bottom:18px;font-size:clamp(26px,6vw,50px);max-width:45%;filter:drop-shadow(0 0 10px #ffb600)}
.hero-content{position:relative;z-index:1;max-width:75%}
.hero h1{margin:0 0 8px;font-size:clamp(20px,5vw,32px);line-height:1.15}
.hero h1 span{color:var(--gold)}
.hero p{font-size:13px;line-height:1.4;margin:0 0 10px}
.gold-btn{background:linear-gradient(135deg,#ffe36b,#ffad08);color:#15100a;font-weight:900;border:0;border-radius:24px;padding:10px 18px;font-size:13px}
.section-heading{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:20px 4px 12px}
.section-heading h2{margin:0;font-size:clamp(18px,4.5vw,24px)}
.section-heading button{background:none;border:0;color:var(--gold);font-size:22px}
.gold-line{width:90px;height:3px;background:var(--gold);margin:6px 0 14px 4px}

/* --- KAT JWÈT YO RANN PI TITI AK PI FLÈCH LA --- */
.games-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.game-card{min-width:0;border:1px solid #48546e;border-radius:12px;overflow:hidden;background:var(--card)}
.game-card.gold{border-bottom:3px solid var(--gold)}
.game-card.blue{border-bottom:3px solid var(--blue)}
.game-art{min-height:75px;aspect-ratio:1.6/1;display:flex;align-items:center;justify-content:center;font-size:clamp(32px,8vw,50px);background:radial-gradient(circle at 50% 35%,#d49a2d55,transparent 55%),linear-gradient(145deg,#24324b,#090e1b)}
.game-card.blue .game-art{background:radial-gradient(circle at 50% 30%,#1177ff66,transparent 60%),linear-gradient(145deg,#09254c,#07101f)}
.game-info{padding:8px 10px}
.game-title{font-size:clamp(13px,3.2vw,16px);font-weight:900;margin-bottom:4px}
.game-desc{color:var(--muted);font-size:11px;line-height:1.3}
.game-footer{display:flex;align-items:center;justify-content:space-between;gap:4px}
.round-btn{flex-shrink:0;border:1px solid var(--gold);background:#0a1020;color:var(--gold);width:28px;height:28px;border-radius:50%;font-size:16px;display:flex;align-items:center;justify-content:center}
.game-card.blue .round-btn{border-color:var(--blue);color:var(--blue)}
/* ---------------------------------------------------- */

.empty-message{display:none;text-align:center;color:var(--muted);padding:20px 10px;font-size:14px}
.panel{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;margin-top:14px}
.panel h2,.panel h3{margin-top:0}
.panel h3{color:var(--gold)}
.notice{font-size:12px;color:var(--muted);line-height:1.5}
.bonus-grid{display:grid;grid-template-columns:1fr;gap:12px}
.bonus-card{border:1px solid #94701c;border-radius:12px;padding:14px;background:linear-gradient(145deg,#241b0a,#0a1223)}
.bonus-card .bonus-tag{color:var(--gold);font-weight:bold;font-size:13px}
.bonus-card strong{display:block;margin:4px 0;font-size:18px;color:#fff}
.bonus-card .bonus-reward{color:var(--gold);font-weight:bold;font-size:14px;margin-bottom:6px}
.bonus-card p{font-size:12px;color:var(--muted);margin:3px 0}
.progress{height:8px;background:#283249;border-radius:8px;overflow:hidden;margin:8px 0}
.progress div{height:100%;width:0;background:linear-gradient(90deg,#ff9900,#ffe36b)}
.small-btn{border:1px solid var(--gold);background:transparent;color:var(--gold);border-radius:8px;padding:8px 10px;font-size:12px}
.full-btn{width:100%;margin-top:8px}
.packages{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.package{border:1px solid #35435e;border-radius:10px;padding:10px 8px;background:#0c172d}
.package strong{display:block;margin-bottom:6px;font-size:13px}
.package .price{color:var(--gold);font-weight:bold;margin-bottom:8px;font-size:13px}
.package button{width:100%;border:0;background:var(--gold);padding:7px;border-radius:6px;font-weight:bold;font-size:12px}
.field{display:block;width:100%;margin:10px 0}
.field label{display:block;color:var(--muted);font-size:12px;margin-bottom:4px}
.field input,.field select,.field textarea{width:100%;padding:10px;border:1px solid #43516c;border-radius:8px;background:#050b18;color:white;font-size:13px}
.bottom-nav{position:fixed;z-index:20;left:8px;right:8px;bottom:6px;max-width:980px;margin:auto;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));background:#0a1225f5;border:1px solid #39445c;border-radius:16px;padding:6px 2px;box-shadow:0 0 18px #0008;backdrop-filter:blur(10px)}
.nav-item{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border:0;color:#b8c1d7;background:none;font-size:9px;font-weight:bold;padding:4px 0;min-width:0}
.nav-icon{font-size:18px;line-height:1}
.nav-item.active{color:var(--gold)}
.modal{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;padding:14px;background:#000c}
.modal.show{display:flex}
.modal-box{width:100%;max-width:400px;max-height:85vh;overflow:auto;border:1px solid var(--gold);border-radius:16px;background:#0a1326;
