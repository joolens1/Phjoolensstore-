<!DOCTYPE html>
<html lang="ht">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PHJoolens Store</title>

<style>

:root{
    --gold:#d99a16;
    --gold2:#efbd4b;
    --dark:#14213d;
    --gray:#687080;
    --white:#ffffff;
    --bg:#f7f8fa;
    --green:#25d366;
    --red:#e74c3c;
}

*{box-sizing:border-box}

html{scroll-behavior:smooth}

body{
    margin:0;
    padding-bottom:90px;
    font-family:Segoe UI,Tahoma,Arial,sans-serif;
    background:var(--bg);
    color:#222;
}

/* ================= LOGIN ================= */

#login-modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.75);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:9999;
    padding:20px;
}

.login-box{
    background:white;
    width:100%;
    max-width:410px;
    padding:30px 24px;
    border-radius:20px;
    text-align:center;
    box-shadow:0 15px 50px rgba(0,0,0,.25);
}

.login-logo{
    font-size:42px;
    margin-bottom:5px;
}

.login-box h2{
    margin:5px 0 10px;
    color:var(--dark);
}

.login-box p{
    color:var(--gray);
    line-height:1.5;
}

.login-box input{
    width:100%;
    padding:14px;
    margin:10px 0;
    border:1px solid #ddd;
    border-radius:10px;
    font-size:16px;
    outline:none;
}

.login-box input:focus{
    border-color:var(--gold);
}

.login-box button{
    width:100%;
    padding:14px;
    border:0;
    border-radius:10px;
    background:linear-gradient(135deg,var(--gold),var(--gold2));
    color:white;
    font-weight:800;
    font-size:16px;
    cursor:pointer;
}

/* ================= HEADER ================= */

header{
    position:sticky;
    top:0;
    z-index:1000;
    background:white;
    padding:13px 15px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    box-shadow:0 2px 10px rgba(0,0,0,.08);
}

.logo{
    font-size:18px;
    font-weight:900;
    color:var(--dark);
}

.wallet{
    background:#fff4d6;
    color:#9a6b00;
    padding:8px 12px;
    border-radius:20px;
    font-weight:800;
    white-space:nowrap;
}

.logout{
    background:var(--red);
    color:white;
    border:0;
    padding:8px 11px;
    border-radius:8px;
    font-weight:700;
    cursor:pointer;
}

/* ================= MAIN ================= */

.container{
    width:100%;
    max-width:900px;
    margin:0 auto;
    padding:22px 15px;
}

.main-title{
    text-align:center;
    margin:5px 0;
    color:var(--dark);
    font-size:30px;
}

.subtitle{
    text-align:center;
    color:var(--gray);
    margin-bottom:20px;
}

/* ================= BONUS MINI BOX ================= */

.bonus-wrapper{
    margin-bottom:18px;
}

.bonus-toggle{
    width:100%;
    border:1px solid rgba(217,154,22,.45);
    background:linear-gradient(135deg,#14213d,#1f3159);
    color:white;
    border-radius:15px;
    padding:15px 17px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    cursor:pointer;
    box-shadow:0 5px 15px rgba(0,0,0,.13);
    font-size:15px;
    font-weight:900;
}

.bonus-toggle-left{
    display:flex;
    align-items:center;
    gap:10px;
}

.bonus-icon{
    width:38px;
    height:38px;
    border-radius:11px;
    background:rgba(217,154,22,.18);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:21px;
}

.bonus-toggle-text{
    text-align:left;
}

.bonus-toggle-title{
    color:var(--gold2);
    font-size:15px;
}

.bonus-toggle-sub{
    color:#d1d5db;
    font-size:11px;
    margin-top:3px;
    font-weight:600;
}

.bonus-arrow{
    font-size:18px;
    transition:.3s;
}

.bonus-toggle.open .bonus-arrow{
    transform:rotate(180deg);
}

.bonus-content{
    display:none;
    margin-top:9px;
    animation:bonusOpen .25s ease;
}

.bonus-content.show{
    display:block;
}

@keyframes bonusOpen{
    from{
        opacity:0;
        transform:translateY(-5px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

.bonus-card{
    background:linear-gradient(135deg,#14213d,#1f3159);
    color:white;
    border-radius:14px;
    padding:15px;
    margin-bottom:9px;
    box-shadow:0 4px 12px rgba(0,0,0,.12);
    border:1px solid rgba(237,189,75,.25);
}

.bonus-card:last-child{
    margin-bottom:0;
}

.bonus-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:8px;
    margin-bottom:8px;
}

.bonus-title{
    font-weight:900;
    font-size:13px;
    color:var(--gold2);
}

.bonus-count{
    background:rgba(217,154,22,.2);
    color:var(--gold2);
    padding:5px 9px;
    border-radius:9px;
    font-weight:900;
    font-size:12px;
    border:1px solid var(--gold);
    white-space:nowrap;
}

.progress-bar-container{
    width:100%;
    background:rgba(255,255,255,.18);
    border-radius:10px;
    height:10px;
    overflow:hidden;
    margin:10px 0;
}

.progress-bar{
    height:100%;
    background:linear-gradient(90deg,var(--gold),var(--gold2));
    width:0%;
    transition:width .4s ease;
}

.bonus-desc{
    font-size:12px;
    color:#d1d5db;
    margin-bottom:10px;
    line-height:1.4;
}

.claim-btn{
    width:100%;
    padding:11px;
    background:linear-gradient(135deg,var(--gold),var(--gold2));
    color:white;
    border:0;
    border-radius:9px;
    font-weight:900;
    cursor:pointer;
    display:none;
}

.claim-btn:hover{
    opacity:.9;
}

/* ================= SERVICES ================= */

.service-title{
    font-size:18px;
    font-weight:900;
    color:var(--dark);
    margin-bottom:10px;
}

.tabs{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:9px;
    margin-bottom:18px;
}

.tab{
    border:1px solid #ddd;
    background:white;
    border-radius:12px;
    padding:10px 7px;
    cursor:pointer;
    font-weight:800;
    min-height:82px;
    transition:.2s;
    text-align:center;
}

.tab:hover{
    transform:translateY(-2px);
}

.tab.active{
    border:2px solid var(--gold);
    background:#fffaf0;
}

.tab span{
    display:block;
    font-size:12px;
}

/* ================= PRODUCT ================= */

.head{
    background:white;
    border:1px solid #e5e5e5;
    border-radius:16px;
    padding:18px;
    margin-bottom:14px;
}

.product-top{
    display:flex;
    align-items:center;
    gap:15px;
}

.product-icon{
    font-size:45px;
    flex-shrink:0;
}

.head h2{
    margin:0 0 7px;
    color:var(--dark);
}

.range{
    font-size:18px;
    font-weight:900;
    color:var(--gold);
}

.desc{
    color:#666;
    line-height:1.5;
    margin-top:10px;
}

/* ================= PACKAGES ================= */

.grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
}

.pkg{
    background:white;
    border:1px solid #d8d8d8;
    border-radius:11px;
    padding:13px 11px;
    text-align:left;
    font-weight:800;
    cursor:pointer;
    min-height:65px;
    transition:.2s;
}

.pkg:hover{
    border-color:var(--gold);
}

.pkg.active{
    border:2px solid var(--gold);
    background:#fff9eb;
}

.pkg small{
    display:block;
    color:#b27b00;
    margin-top:6px;
    font-size:14px;
}

.ff-row-container{
    grid-column:span 2;
    background:#fff;
    border:1px solid #e5e5e5;
    border-radius:12px;
    padding:12px;
    margin-bottom:5px;
}

.ff-row-title{
    font-size:14px;
    font-weight:800;
    color:var(--dark);
    margin-bottom:8px;
    border-left:3px solid var(--gold);
    padding-left:6px;
}

.ff-row-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:8px;
}

/* ================= SELECTED ================= */

.selected{
    background:white;
    border:1px solid #e5e5e5;
    border-radius:13px;
    padding:15px;
    margin:15px 0;
    font-size:21px;
    font-weight:900;
    color:var(--dark);
    text-align:center;
}

/* ================= FORM ================= */

.form{
    background:white;
    border:1px solid #e3e3e3;
    border-radius:15px;
    padding:17px;
}

.badge{
    display:inline-block;
    background:#fff8df;
    border:1px solid #f0d88a;
    color:#8a6800;
    padding:7px 10px;
    border-radius:7px;
    font-size:13px;
    font-weight:800;
    margin-bottom:10px;
}

.form label{
    display:block;
    font-weight:800;
    margin:10px 0 6px;
}

.form input{
    width:100%;
    padding:13px;
    border:1px solid #ccc;
    border-radius:9px;
    font-size:16px;
    outline:none;
}

.form input:focus{
    border-color:var(--gold);
}

.hint{
    font-size:12px;
    color:#777;
    margin-top:5px;
}

/* ================= BUY ================= */

.buy{
    width:100%;
    margin-top:14px;
    padding:15px;
    border:0;
    border-radius:11px;
    background:linear-gradient(135deg,var(--gold),var(--gold2));
    color:white;
    font-weight:900;
    font-size:17px;
    cursor:pointer;
    box-shadow:0 5px 15px rgba(217,154,22,.25);
}

.buy:hover{
    opacity:.92;
}

/* ================= PAYMENT ================= */

.payment{
    background:#edf7ff;
    border-left:5px solid #2196f3;
    padding:17px;
    margin-top:20px;
    border-radius:10px;
}

.payment h3{
    margin-top:0;
    color:#145a85;
}

.payment p{
    margin:8px 0;
    font-size:14px;
}

.payment-number{
    font-size:16px;
    font-weight:900;
}

/* ================= ORDERS ================= */

#orders-modal{
    display:none;
    position:fixed;
    inset:0;
    z-index:5000;
    background:rgba(0,0,0,.7);
    padding:20px;
    overflow-y:auto;
}

.orders-box{
    background:white;
    max-width:650px;
    margin:40px auto;
    border-radius:18px;
    padding:20px;
}

.orders-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
}

.close-btn{

    width
