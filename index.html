<title>PH JOOLENS STORE</title>

<style>
:root{
--gold:#ffca28;
--gold2:#ff9900;
--bg:#030918;
--card:#0b1429;
--text:#fff;
--muted:#b5bfd5;
--border:#34405b;
--blue:#168cff
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
margin:0;padding-bottom:100px;background:var(--bg);
color:var(--text);font-family:Arial,Helvetica,sans-serif
}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.container{max-width:1000px;margin:auto;padding:12px}
.hidden{display:none!important}

header{
display:flex;align-items:center;justify-content:space-between;
gap:8px;padding:8px 0 15px
}
.brand{display:flex;align-items:center;gap:8px;min-width:0}
.logo{font-size:36px;filter:drop-shadow(0 0 8px #ffbb22)}
.brand-name{
color:var(--gold);font-size:clamp(16px,4vw,27px);
font-weight:900;letter-spacing:1px;white-space:nowrap
}
.brand-sub{text-align:center;letter-spacing:5px;font-size:11px;margin-top:2px}
.header-actions{display:flex;gap:5px}
.icon-btn{background:none;border:0;color:white;font-size:23px;padding:5px}

.search-box{
display:flex;align-items:center;gap:10px;
background:#0b1426;border:1px solid #63718c;
border-radius:18px;padding:0 16px;margin-bottom:20px
}
.search-box span{font-size:26px;color:#aab8d2}
.search-box input{
width:100%;min-width:0;padding:15px 0;color:white;
background:transparent;border:0;outline:none;font-size:16px
}
.search-box input::placeholder{color:#9daac1}

.hero{
position:relative;overflow:hidden;min-height:250px;
display:flex;align-items:center;padding:28px;
border:2px solid var(--gold);border-radius:22px;
background:

url("https://images.unsplash.com/photo-1542751371-adc38448a05e?auto=format&fit=crop&w=1400&q=85")
center/cover;
box-shadow:0 0 20px #ffb00035
}
.hero::after{
content:"💎";position:absolute;right:8%;bottom:12px;
font-size:clamp(75px,18vw,130px);
filter:drop-shadow(0 0 15px #ffb000)
}
.hero-content{position:relative;z-index:2;max-width:75%}
.hero h1{
margin:0 0 12px;font-size:clamp(22px,5.5vw,36px);
line-height:1.2;color:#fff;font-weight:900
}
.hero h1 span{color:var(--gold)}
.hero p{font-size:14px;line-height:1.5;margin:0 0 16px}
.gold-btn{
background:linear-gradient(135deg,#ffe878,#ffb000);
color:#15100a;font-weight:900;border:0;border-radius:28px;
padding:12px 22px;font-size:14px
}

.section-heading{
display:flex;align-items:center;justify-content:space-between;
gap:8px;margin:26px 4px 12px
}
.section-heading h2{
margin:0;font-size:clamp(20px,5vw,27px);font-weight:900
}
.section-heading button{
background:none;border:0;color:var(--gold);font-size:28px
}
.gold-line{
width:105px;height:4px;border-radius:4px;
background:linear-gradient(90deg,#ffe878,#ff9900);
margin:6px 0 18px 4px
}

.games-grid{
display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px
}
.game-card{
min-width:0;border:1px solid #66552c;border-radius:17px;
overflow:hidden;background:linear-gradient(145deg,#10192b,#050a16);
box-shadow:0 5px 15px #0005;transition:transform .2s
}
.game-card:active{transform:scale(.97)}
.game-card.gold{border-bottom:3px solid var(--gold)}
.game-card.blue{border-bottom:3px solid var(--blue)}

position:relative;min-height:145px;aspect-ratio:1.45/1;

font-size:clamp(48px,12vw,70px);color:#ffca28;
text-shadow:0 3px 12px #000;
background:
linear-gradient(180deg,rgba(3,8,18,.05),rgba(3,8,18,.35)),
url("https://images.unsplash.com/photo-1511512578047-dfb367046420?auto=format&fit=crop&w=800&q=80")
center/cover
}
.game-card.blue .game-art{
background:
linear-gradient(180deg,rgba(0,20,60,.03),rgba(0,20,60,.3)),
url("https://images.unsplash.com/photo-1574629810360-7efbbe195018?auto=format&fit=crop&w=800&q=80")
center/cover
}
