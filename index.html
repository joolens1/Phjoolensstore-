<!DOCTYPE html>
<html lang="ht">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PHJoolens Store</title>

<style>
:root {
  --gold: #d99a16;
  --gold2: #efbd4b;
  --dark: #101827;
  --dark2: #192438;
  --white: #ffffff;
  --gray: #aab3c2;
  --green: #25d366;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html {
  scroll-behavior: smooth;
}

body {
  background: #0c1320;
  color: white;
  font-family: Arial, sans-serif;
  padding-bottom: 85px;
  min-height: 100vh;
}

button, input, select {
  font-family: inherit;
}

button {
  cursor: pointer;
}

header {
  background: #111c2e;
  border-bottom: 2px solid var(--gold);
  padding: 16px;
  position: sticky;
  top: 0;
  z-index: 10;
}

.header-content {
  max-width: 1100px;
  margin: auto;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
}

.logo {
  color: var(--gold2);
  font-size: 20px;
  font-weight: bold;
}

.logo span {
  display: block;
  color: white;
  font-size: 11px;
  margin-top: 5px;
  font-weight: normal;
}

.wallet {
  background: #26354b;
  border: 1px solid var(--gold);
  border-radius: 10px;
  padding: 9px;
  font-size: 12px;
}

.hero {
  margin: 18px auto;
  max-width: 1100px;
  padding: 28px 18px;
  background: linear-gradient(135deg, #1b2a42, #101827);
  border: 1px solid #344258;
  border-radius: 18px;
