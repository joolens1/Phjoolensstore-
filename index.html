



<!DOCTYPE html>
<html lang="ht">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PH JOOLENS STORE - Top-Up Free Fire</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #fbf7ee;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: #ffffff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
        }
        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 5px;
        }
        .subtitle {
            text-align: center;
            font-size: 13px;
            color: #64748b;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #555;
        }
        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #ff5722;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover {
            background-color: #e64a19;
        }
        #resultMessage {
            margin-top: 15px;
            text-align: center;
            font-weight: bold;
        }
        .github-link {
            text-align: center;
            margin-top: 20px;
        }
        .github-link a {
            color: #333;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
        }
        .github-link a:hover {
            color: #ff5722;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>PH JOOLENS STORE</h2>
        <div class="subtitle">Top-Up Free Fire Otomatik</div>
        
        <form id="topupForm">
            <div class="form-group">
                <label for="playerId">ID Jwè Free Fire:</label>
                <input type="text" id="playerId" placeholder="Antre ID jwè a" required>
            </div>

            <div class="form-group">
                <label for="packageId">Pake Dyaman:</label>
                <select id="packageId">
                    <option value="100_diamonds">100 Dyaman - 150 HTG</option>
                    <option value="310_diamonds">310 Dyaman - 400 HTG</option>
                    <option value="520_diamonds">520 Dyaman - 650 HTG</option>
                </select>
            </div>

            <div class="form-group">
                <label for="paymentCode">Kòd Peman (Opsyonèl):</label>
                <input type="text" id="paymentCode" placeholder="Antre kòd tranzaksyon an">
            </div>

            <button type="submit">Voye Top-Up la</button>
        </form>

        <div id="resultMessage"></div>

        <!-- Lyen GitHub ou -->
        <div class="github-link">
            <a href="https://github.com/joolens1/ph-joolens-store-app" target="_blank">
                📂 Vizite GitHub mwen
            </a>
        </div>
    </div>

    <script>
        document.getElementById('topupForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const playerId = document.getElementById('playerId').value;
            const packageId = document.getElementById('packageId').value;
            const paymentCode = document.getElementById('paymentCode').value;
            const resultDiv = document.getElementById('resultMessage');

            resultDiv.style.color = '#333';
            resultDiv.innerText = 'Ap voye demann lan...';

            try {
                const response = await fetch('/api/topup', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ playerId, packageId, paymentCode })
                });

                const data = await response.json();

                if (data.success) {
                    resultDiv.style.color = 'green';
                    resultDiv.innerText = data.message;
                } else {
                    resultDiv.style.color = 'red';
                    resultDiv.innerText = 'Erè: ' + data.message;
                }
            } catch (err) {
                resultDiv.style.color = 'red';
                resultDiv.innerText = 'Gen yon pwoblèm koneksyon ki fèt!';
            }
        });
    </script>

</body>
</html>
