<!DOCTYPE html>
<html lang="ht">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#030918">
<title>PH JOOLENS STORE</title>

<style>
:root{
--gold:#ffca28;
--gold2:#ff9900;
--bg:#030918;
--card:#0b1429;
--text:#fff;
--muted:#b5bfd5;
--border:#34405b;
--blue:#168cff;
}

*{box-sizing:border-box}
body{
margin:0;
padding-bottom:95px;
background:radial-gradient(ellipse at 10% 5%,#12315b55,transparent 35%),radial-gradient(ellipse at 90% 35%,#80500e33,transparent 35%),var(--bg);
color:var(--text);
font-family:Arial,sans-serif;
min-height:100vh;
}

button,input,select,textarea{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}

.container{
max-width:1000px;
margin:auto;
padding:12px;
}

/* SPLASH SCREEN */

#splashScreen,#appLoader,#pageLoader{
position:fixed;
inset:0;
z-index:9999;
background:radial-gradient(circle,#152849,#030918 70%);
display:flex;
align-items:center;
justify-content:center;
flex-direction:column;
text-align:center;
}

.splash-logo{
font-size:85px;
filter:drop-shadow(0 0 25px #ffca28);
animation:float 1.5s infinite alternate;
}

.splash-title{
font-size:30px;
font-weight:1000;
color:var(--gold);
letter-spacing:2px;
text-shadow:0 0 20px #ff9900;
}

.splash-sub{
letter-spacing:5px;
font-size:13px;
margin-top:5px;
}

@keyframes float{
from{transform:translateY(0) scale(1)}
to{transform:translateY(-12px) scale(1.08)}
}

/* LOADING SCREEN */

.loader-logo{
font-size:65px;
margin-bottom:15px;
filter:drop-shadow(0 0 20px #ffca28);
}

.loader-title{
color:var(--gold);
font-size:25px;
font-weight:1000;
}

.loader-spin{
width:55px;
height:55px;
border:5px solid #34405b;
border-top-color:var(--gold);
border-right-color:var(--gold2);
border-radius:50%;
animation:spin .8s linear infinite;
margin:30px auto 15px;
}

@keyframes spin{to{transform:rotate(360deg)}}

.loader-text{
font-size:14px;
color:white;
margin-bottom:15px;
}

.loader-bar{
width:75%;
max-width:320px;
height:9px;
background:#26334b;
border-radius:20px;
overflow:hidden;
}

.loader-progress{
height:100%;
width:0;
background:linear-gradient(90deg,#ff9900,#ffe36b);
border-radius:20px;
animation:progress 5s linear forwards;
}

@keyframes progress{to{width:100%}}

.loader-hidden{
opacity:0;
visibility:hidden;
transition:.4s;
pointer-events:none;
}

/* PAGE LOADING */

#pageLoader{
z-index:9000;
display:none;
}

#pageLoader.show{display:flex}

#pageLoader .loader-spin{
width:48px;
height:48px;
}

/* HEADER */

header{
display:flex;
align-items:center;
justify-content:space-between;
padding:10px 0 16px;
}

.brand{
display:flex;
align-items:center;
gap:9px;
}

.logo{font-size:32px}

.brand-name{
color:var(--gold);
font-size:21px;
font-weight:1000;
}

.brand-sub{
text-align:center;
letter-spacing:5px;
font-size:10px;
}

.icon-btn{
background:none;
border:0;
color:white;
font-size:21px;
padding:5px;
}

.header-actions{display:flex;gap:8px}

/* FEATURES */

.top-features{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:8px;
padding:12px;
border:1px solid var(--border);
border-radius:15px;
background:linear-gradient(135deg,#101e38,#081225);
margin-bottom:15px;
text-align:center;
}

.feat-item{
font-size:12px;
color:var(--muted);
font-weight:bold;
border-right:1px solid #34405b;
}

.feat-item:last-child{border:0}
.feat-item span:first-child{
display:block;
font-size:19px;
}

/* SEARCH */

.search-box{
display:flex;
align-items:center;
gap:10px;
background:#0b1426;
border:1px solid #63718c;
border-radius:13px;
padding:0 13px;
margin-bottom:18px;
}

.search-box input{
width:100%;
padding:13px 0;
background:transparent;
border:0;
outline:none;
color:white;
}

/* HERO */

.hero{
position:relative;
overflow:hidden;
min-height:160px;
display:flex;
align-items:center;
padding:20px;
border:2px solid var(--gold);
border-radius:18px;
background:radial-gradient(circle at 85% 50%,#
