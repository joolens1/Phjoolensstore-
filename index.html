<!DOCTYPE html>
<html lang="ht">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PH Joolens Store - Gaming Top Up</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#fbf7ee">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #fbf7ee;
            color: #1e293b;
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
        }
        .container {
            max-width: 480px;
            width: 100%;
            background-color: #ffffff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            border: 1px solid #e2d9c2;
        }
        h2 { 
            text-align: center; 
            color: #27272a; 
            margin-bottom: 5px;
            font-size: 22px;
        }
        .subtitle {
            text-align: center;
            font-size: 13px;
            color: #64748b;
            margin-bottom: 20px;
        }
        .install-btn {
            display: none;
            width: 100%;
            background-color: #10b981;
            color: white;
            padding: 10px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            margin-bottom: 20px;
        }
        .catalog-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }
        .game-card {
            background-color: #f8fafc;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            padding: 15px 10px;
            text-align: center;
            cursor: pointer;
            transition: 0.2s;
        }
        .game-card:hover {
            border-color: #d97706;
            background-color: #fffbeb;
            transform: translateY(-2px);
        }
        .game-card h3 {
            font-size: 15px;
            margin: 8px 0 4px 0;
            color: #1e293b;
        }
        .game-card p {
            font-size: 11px;
            color: #64748b;
            margin: 0;
        }
        .form-section {
            display: none;
            background: #f8fafc;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #e2d9c2;
            margin-top: 15px;
        }
        .form-group { 
            margin-bottom: 12px; 
        }
        label { 
            display: block; 
            margin-bottom: 5px; 
            font-weight: bold; 
            font-size: 13px;
            color: #334155;
        }
        input, select {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #cbd5e1;
            background-color: #ffffff;
            color: #0f172a;
            box-sizing: border-box;
            font-size: 13px;
            outline: none;
        }
        input:focus, select:focus {
            border-color: #d97706;
        }
        .back-btn {
            background: none;
            border: none;
            color: #d97706;
            font-weight: bold;
            cursor: pointer;
            font-size: 13px;
            margin-bottom: 10px;
            padding: 0;
        }
        .submit-btn {
            width: 100%;
            padding: 12px;
            background-color: #d97706;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 5px;
        }
        .submit-btn:hover { 
            background-color: #b45309; 
        }
    </style>
</head>
<body>

<div class="container">
    <h2>PH Joolens Store 🎮</h2>
    <div class="subtitle">Katalòg Top-Up Otomatik & Manuel</div>

    <button id="installBtn" class="install-btn">📲 Mete App a sou ekran telefòn ou</button>

    <!-- LISTE JWÈT YO (Kòm nan 2zyèm imaj la) -->
    <div id="catalogView">
        <div class="catalog-grid">
            <div class="game-card" onclick="openGameForm('Free Fire')">
                <span style="font-size: 28px;">🔥</span>
                <h3>Free Fire</h3>
                <p>Top-up & Pass</p>
            </div>
            <div class="game-card" onclick="openGameForm('Pubg Mobile')">
                <span style="font-size: 28px;">🎯</span>
                <h3>Pubg Mobile</h3>
                <p>UC & Pass</p>
            </div>
            <div class="game-card" onclick="openGameForm('Blood Strike')">
                <span style="font-size: 28px;">⚔️</span>
                <h3>Blood Strike</h3>
                <p>Gold & Pass</p>
            </div>
            <div class="game-card" onclick="openGameForm('Flex City')">
                <span style="font-size: 28px;">🏎️</span>
                <h3>Flex City</h3>
                <p>Diamants & Pass</p>
            </div>
        </div>
    </div>

    <!-- FÒM KÒMAND LAN (Lè w klike sou yon jwèt) -->
    <div id="formSection" class="form-section">
        <button class="button back-btn" onclick="goBackToCatalog()">← Retounen nan Katagòi</button>
        <h3 id="formTitle" style="margin-top: 5px; font-size: 16px; color: #d97706;">Kòmande</h3>

        <form id="orderForm">
            <input type="hidden" id="selectedGame">

            <div class="form-group">
                <label for="playerId">ID Jwèt / Kont:</label>
                <input type="text" id="playerId" placeholder="Antre ID ou a" required>
            </div>

            <div class="form-group">
                <label for="packageSelect">Chwazi Pake / Pri:</label>
                <select id="packageSelect" required>
                    <!-- Pakè yo pral chaje otomatikman -->
                </select>
            </div>

            <div class="form-group">
                <label for="paymentMethod">Metòd Peman:</label>
                <select id="paymentMethod" required>
                    <option value="MonCash">MonCash</option>
                    <option value="Natcash">Natcash</option>
                </select>
            </div>

            <div class="form-group">
                <label for="senderPhone">Nimewo ki voye peman an:</label>
                <input type="tel" id="senderPhone" placeholder="Antre nimewo ou voye l la" required>
            </div>

            <button type="button" class="submit-btn" onclick="sendOrder()">Voye Kòmand lan sou WhatsApp</button>
        </form>
    </div>
</div>

<script>
    // Tout pakè ak pri pou chak jwèt
    const gamePackages = {
        "Free Fire": [
            "110 Diamants",
            "220 Diamants",
            "341 Diamants",
            "451 Diamants",
            "572 Diamants",
            "682 Diamants",
            "792 Diamants",
            "913 Diamants",
            "1166 Diamants",
            "2398 Diamants",
            "3564 Diamants",
            "6160 Diamants",
            "12260 Diamants",
            "Booyah pass",
            "Abonnement semaine",
            "Abonnement mois",
            "Super Vip"
        ],
        "Pubg Mobile": [
            "60 UC - 180g",
            "325 UC - 875g",
            "660 UC - 1600g",
            "1800 UC - 3500g",
            "3850 UC - 8000g",
            "8100 UC - 16900g",
            "16200 UC - 33000g"
        ],
        "Blood Strike": [
            "51 Gold - 76g",
            "105 Gold - 125g",
            "320 Gold - 400g",
            "540 Gold - 700g",
            "1100 Gold - 1450g",
            "2260 Gold - 2850g",
            "5800 Gold - 7250g",
            "Lucky bag - 155g",
            "Season pass - 150g",
            "Level Up pass - 310g",
            "Strike pass Elite - 600g",
            "Strike pass premium - 1300g",
            "Cornucopia - 295g"
        ],
        "Flex City": [
            "340 Diamants",
            "520 Diamants - 2050g",
            "1166 Diamants - 5100g",
            "2330 Diamants - 10000g",
            "4760 Diamants - 10700g",
            "12320 Diamants - 20400g",
            "Level Up - 1000g",
            "Flex pass - 535g",
            "Flex pass plus - 700g"
        ]
    };

    function openGameForm(gameName) {
        document.getElementById('catalogView').style.display = 'none';
        document.getElementById('formSection').style.display = 'block';
        document.getElementById('selectedGame').value = gameName;
        document.getElementById('formTitle').innerText = 'Kòmande pou: ' + gameName;

        let pkgSelect = document.getElementById('packageSelect');
        pkgSelect.innerHTML = '<option value="">-- Chwazi yon pake --</option>';

        if(gamePackages[gameName]) {
            gamePackages[gameName].forEach(pkg => {
                let opt = document.createElement('option');
                opt.value = pkg;
                opt.innerText = pkg;
                pkgSelect.appendChild(opt);
            });
        }
    }

    function goBackToCatalog() {
        document.getElementById('formSection').style.display = 'none';
        document.getElementById('catalogView').style.display = 'block';
    }

    function sendOrder() {
        const game = document.getElementById('selectedGame').value;
        const id = document.getElementById('playerId').value;
        const pkg = document.getElementById('packageSelect').value;
        const method = document.getElementById('paymentMethod').value;
        const phone = document.getElementById('senderPhone').value;

        if(!game || !id || !pkg || !phone) {
            alert('Tanpri ranpli tout enfòmasyon yo anvan ou voye l!');
            return;
        }

        const myPhone = "50932265636"; 
        const text = `Bonjou PH Joolens Store, mwen fè yon kòmand:%0A- *Jwèt:* ${game}%0A- *ID Jwèt:* ${id}%0A- *Pake:* ${pkg}%0A- *Metòd:* ${method}%0A- *Nimewo Peman:* ${phone}`;

        window.open(`https://api.whatsapp.com/send?phone=${myPhone}&text=${text}`, '_blank');
    }

    let deferredPrompt;
    const installBtn = document.getElementById('installBtn');

    window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        installBtn.style.display = 'block';

        installBtn.addEventListener('click', () => {
            installBtn.style.display = 'none';
            deferredPrompt.prompt();
            deferredPrompt.choiceResult.then((choiceResult) => {
                deferredPrompt = null;
            });
        });
    });
</script>

</body>
</html>
