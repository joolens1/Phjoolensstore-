

<!DOCTYPE html>
<html lang="ht">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PH Joolens Store - Gaming Top Up</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#fbf7ee">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #fbf7ee;
            color: #1e293b;
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
        }
        .container {
            max-width: 480px;
            width: 100%;
            background-color: #ffffff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            border: 1px solid #e2d9c2;
        }
        h2 { 
            text-align: center; 
            color: #27272a; 
            margin-bottom: 5px;
            font-size: 22px;
        }
        .subtitle {
            text-align: center;
            font-size: 13px;
            color: #64748b;
            margin-bottom: 20px;
        }
        .install-btn {
            display: none;
            width: 100%;
            background-color: #10b981;
            color: white;
            padding: 10px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            margin-bottom: 20px;
        }
        .catalog-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }
        .game-card {
            background-color: #f8fafc;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            padding: 15px 10px;
            text-align: center;
            cursor: pointer;
            transition: 0.2s;
        }
        .game-card:hover {
            border-color: #d97706;
            background-color: #fffbeb;
            transform: translateY(-2px);
        }
        .game-card h3 {
            font-size: 15px;
            margin: 8px 0 4px 0;
            color: #1e293b;
        }
        .game-card p {
            font-size: 11px;
            color: #64748b;
            margin: 0;
        }
        .form-section {
            display: none;
            background: #ffffff;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #e2d9c2;
            margin-top: 15px;
        }
        .price-display {
            font-size: 22px;
            font-weight: bold;
            color: #1e293b;
            margin: 10px 0;
        }
        .form-group { 
            margin-bottom: 15px; 
        }
        label { 
            display: block; 
            margin-bottom: 6px; 
            font-weight: bold; 
            font-size: 13px;
            color: #334155;
        }
        input, select {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #cbd5e1;
            background-color: #ffffff;
            color: #0f172a;
            box-sizing: border-box;
            font-size: 13px;
            outline: none;
        }
        input:focus, select:focus {
            border-color: #d97706;
        }
        .packages-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 15px;
        }
        .pkg-btn {
            background-color: #f8fafc;
            border: 1px solid #cbd5e1;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            color: #334155;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .pkg-btn:hover {
            border-color: #d97706;
            background-color: #fffbeb;
        }
        .pkg-btn.active {
            background-color: #ffffff;
            color: #0f172a;
            border: 2px solid #0f172a;
            font-weight: bold;
        }
        .back-btn {
            background: none;
            border: none;
            color: #d97706;
            font-weight: bold;
            cursor: pointer;
            font-size: 13px;
            margin-bottom: 10px;
            padding: 0;
        }
        .submit-btn {
            width: 100%;
            padding: 14px;
            background-color: #d97706;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 5px;
        }
        .submit-btn:hover { 
            background-color: #b45309; 
        }
    </style>
</head>
<body>

<div class="container">
    <h2>PH Joolens Store 🎮</h2>
    <div class="subtitle">Katalòg Top-Up Otomatik & Manuel</div>

    <button id="installBtn" class="install-btn">📲 Mete App a sou ekran telefòn ou</button>

    <!-- LISTE JWÈT YO -->
    <div id="catalogView">
        <div class="catalog-grid">
            <div class="game-card" onclick="openGameForm('Free Fire')">
                <span style="font-size: 28px;">🔥</span>
                <h3>Free Fire</h3>
                <p>Top-up & Pass</p>
            </div>
            <div class="game-card" onclick="openGameForm('PUBG Mobile')">
                <span style="font-size: 28px;">🎯</span>
                <h3>PUBG Mobile</h3>
                <p>UC & Pass</p>
            </div>
            <div class="game-card" onclick="openGameForm('Blood Strike')">
                <span style="font-size: 28px;">⚔️</span>
                <h3>Blood Strike</h3>
                <p>Gold & Pass</p>
            </div>
            <div class="game-card" onclick="openGameForm('Flex City')">
                <span style="font-size: 28px;">🏎️</span>
                <h3>Flex City</h3>
                <p>Diamants & Pass</p>
            </div>
        </div>
    </div>

    <!-- FÒM KÒMAND LAN -->
    <div id="formSection" class="form-section">
        <button class="back-btn" onclick="goBackToCatalog()">← Retounen nan Katalòg</button>
        <h3 id="formTitle" style="margin-top: 5px; margin-bottom: 0; font-size: 20px; color: #1e293b;">Jwèt</h3>
        
        <div id="priceDisplay" class="price-display">G 0.00</div>

        <form id="orderForm">
            <div class="form-group">
                <div id="packagesGrid" class="packages-grid">
                    <!-- Ti bouton pakè yo ap parèt isit la -->
                </div>
            </div>

            <div class="form-group">
                <label for="playerName">Nom sur le compte / Non sou kont lan:</label>
                <input type="text" id="playerName" placeholder="Antre non ki sou kont lan" required>
            </div>

            <div class="form-group">
                <label for="playerId">Id du joueur / ID Jwèt:</label>
                <input type="text" id="playerId" placeholder="Antre ID ou a" required>
            </div>

            <div class="form-group">
                <label for="paymentMethod">Metòd Peman:</label>
                <select id="paymentMethod" required>
                    <option value="MonCash">MonCash</option>
                    <option value="Natcash">Natcash</option>
                </select>
            </div>

            <div class="form-group">
                <label for="senderPhone">Nimewo ki voye peman an:</label>
                <input type="tel" id="senderPhone" placeholder="Antre nimewo ou voye l la" required>
            </div>

            <button type="button" class="submit-btn" onclick="sendOrder()">ACHETER MAINTENANT</button>
        </form>
    </div>
</div>

<script>
    // Lis pakè ak pri an Goud (G) ak ti ikon yo
    const gamePackages = {
        "Blood Strike": [
            { name: "51🪙", price: 76 },
            { name: "105🪙", price: 125 },
            { name: "320🪙", price: 400 },
            { name: "540🪙", price: 700 },
            { name: "1100🪙", price: 1450 },
            { name: "2260🪙", price: 2850 },
            { name: "5800🪙", price: 7250 },
            { name: "Lucky bag", price: 155 },
            { name: "Season Pass🏷️", price: 150 },
            { name: "Level Up Pass🏷️", price: 310 },
            { name: "Strike Pass Elite🏷️", price: 600 },
            { name: "Strike Pass Premium🏷️", price: 1300 },
            { name: "Cornucopia✨", price: 295 }
        ],
        "Flex City": [
            { name: "340💎", price: 535 },
            { name: "520💎", price: 2050 },
            { name: "1165💎", price: 5100 },
            { name: "2330💎", price: 10000 },
            { name: "4750💎", price: 10700 },
            { name: "12320💎", price: 20400 },
            { name: "2310🪙", price: 750 },
            { name: "6875🪙", price: 2050 },
            { name: "18700🪙", price: 5100 },
            { name: "80000🪙", price: 15000 },
            { name: "150000🪙", price: 25000 },
            { name: "635 500💵", price: 1200 },
            { name: "2 062 500💵", price: 3500 },
            { name: "5 610 000💵", price: 8500 },
            { name: "36 000 000💵", price: 30000 },
            { name: "79 200 000💵", price: 60000 },
            { name: "Level Up💵🪙💎", price: 1000 },
            { name: "Flex pass💵🪙💎", price: 535 },
            { name: "flex pass plus💵🪙💎", price: 700 }
        ],
        "Free Fire": [
            { name: "110💎", price: 160 },
            { name: "220💎", price: 320 },
            { name: "341💎", price: 500 },
            { name: "451💎", price: 650 },
            { name: "572💎", price: 820 },
            { name: "682💎", price: 980 },
            { name: "792💎", price: 1140 },
            { name: "913💎", price: 1300 },
            { name: "1166💎", price: 1650 },
            { name: "2398💎", price: 3300 },
            { name: "3564💎", price: 4900 },
            { name: "6160💎", price: 8400 },
            { name: "12260💎", price: 16500 },
            { name: "Booyah pass🏷️", price: 500 },
            { name: "Abonnement semaine", price: 250 },
            { name: "Abonnement mois", price: 1000 },
            { name: "Super Vip", price: 1300 }
        ],
        "PUBG Mobile": [
            { name: "60 UC🎯", price: 180 },
            { name: "325 UC🎯", price: 875 },
            { name: "660 UC🎯", price: 1600 },
            { name: "1800 UC🎯", price: 3500 },
            { name: "3850 UC🎯", price: 8000 },
            { name: "8100 UC🎯", price: 16900 },
            { name: "16200 UC🎯", price: 33000 }
        ]
    };

    let currentGame = "";
    let selectedPkg = null;

    function openGameForm(gameName) {
        currentGame = gameName;
        selectedPkg = null;
        document.getElementById('catalogView').style.display = 'none';
        document.getElementById('formSection').style.display = 'block';
        document.getElementById('formTitle').innerText = gameName + " Automatique";
        document.getElementById('priceDisplay').innerText = "G 0.00";

        let gridContainer = document.getElementById('packagesGrid');
        gridContainer.innerHTML = '';

        if(gamePackages[gameName]) {
            gamePackages[gameName].forEach(pkg => {
                let btn = document.createElement('div');
                btn.className = 'pkg-btn';
                btn.innerText = pkg.name;
                btn.onclick = function() {
                    let allBtns = gridContainer.querySelectorAll('.pkg-btn');
                    allBtns.forEach(b => b.classList.remove('active'));
                    
                    btn.classList.add('active');
                    selectedPkg = pkg;
                    document.getElementById('priceDisplay').innerText = "G " + pkg.price.toLocaleString() + ".00";
                };
                gridContainer.appendChild(btn);
            });
        }
    }

    function goBackToCatalog() {
        document.getElementById('formSection').style.display = 'none';
        document.getElementById('catalogView').style.display = 'block';
    }

    function sendOrder() {
        const name = document.getElementById('playerName').value;
        const id = document.getElementById('playerId').value;
        const method = document.getElementById('paymentMethod').value;
        const phone = document.getElementById('senderPhone').value;

        if(!selectedPkg || !id || !phone) {
            alert('Tanpri chwazi yon pake epi ranpli tout enfòmasyon yo!');
            return;
        }

        const myPhone = "50932265636"; 
        const text = `Bonjou PH Joolens Store, mwen fè yon kòmand:%0A- *Jwèt:* ${currentGame}%0A- *Pake:* ${selectedPkg.name}%0A- *Pri:* G ${selectedPkg.price}.00%0A- *Non sou kont:* ${name}%0A- *ID Jwèt:* ${id}%0A- *Metòd:* ${method}%0A- *Nimewo Peman:* ${phone}`;

        window.open(`https://api.whatsapp.com/send?phone=${myPhone}&text=${text}`, '_blank');
    }

    let deferredPrompt;
    const installBtn = document.getElementById('installBtn');

    window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        installBtn.style.display = 'block';

        installBtn.addEventListener('click', () => {
            installBtn.style.display = 'none';
            deferredPrompt.prompt();
            deferredPrompt.choiceResult.then((choiceResult) => {
                deferredPrompt = null;
            });
        });
    });
</script>

</body>
</html>
