<style>
:root{
    --gold:#c59b27;

    --dark:#2f3542;

*{box-sizing:border-box}

body{
    margin:0;
    padding-bottom:90px;
    font-family:Arial,sans-serif;
    background:var(--bg);
    color:#333;
}

header{
    position:sticky;
    top:0;
    z-index:100;
    background:white;
    padding:14px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    box-shadow:0 2px 6px #0002;
}

.logo{
    font-size:20px;
    font-weight:bold;
    color:var(--dark);
}

.wallet{
    background:#fff3cd;
    color:#856404;
    padding:7px 12px;
    border-radius:20px;
    font-weight:bold;
}

.container{
    max-width:700px;
    margin:auto;
    padding:20px 15px;
}

h1{
    margin-bottom:5px;
}

.subtitle{
    color:#666;
}

.services{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
    margin:20px 0;
}

.service{
    background:white;
    border:1px solid #ddd;
    border-radius:12px;
    padding:15px 8px;
    font-weight:bold;
    cursor:pointer;
}

.service.active{
    border:2px solid var(--gold);
    background:#fff8e8;
}

.card{
    background:white;
    border-radius:14px;
    padding:18px;
    border:1px solid #ddd;
}

.card h2{
    margin-top:0;
}

.packages{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:9px;
}

.package{
    background:white;
    border:1px solid #ccc;
    border-radius:9px;
    padding:12px 8px;
    cursor:pointer;
    font-weight:bold;
}

.package.active{
    border:2px solid var(--gold);
    background:#fff8e8;
}

.price{
    display:block;
    margin-top:6px;
    color:#a16d2f;
}

.coming{
    color:#777;
    font-size:13px;
}

.selected{
    margin-top:18px;
    padding:14px;
    background:#f1f1f1;
    border-radius:9px;
    font-size:20px;
    font-weight:bold;
}

.input-group{
    margin-top:18px;
}

.input-group label{
    display:block;
    font-weight:bold;
    margin-bottom:7px;
}

.input-group input{
    width:100%;
    padding:13px;
    border:1px solid #ccc;
    border-radius:9px;
    font-size:16px;
}

.buy{
    width:100%;
    margin-top:18px;
    padding:15px;
    border:none;
    border-radius:10px;
    background:var(--gold2);
    color:white;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
}

.buy:hover{
    background:#bd8e58;
}

.payment{
    margin-top:20px;
    background:#e8f4fd;
    border-left:5px solid #2196f3;
    padding:15px;
    border-radius:8px;
}

.bottom-nav{
    position:fixed;
    bottom:0;
    left:0;
    width:100%;
    background:white;
    display:flex;
    justify-content:space-around;
    padding:8px 0;
    box-shadow:0 -2px 6px #0002;
    z-index:99;
}

.nav-item{
    text-align:center;
    color:#666;
    font-size:12px;
    cursor:pointer;
}

.nav-item div{
    font-size:21px;
}

.nav-item.active{
    color:var(--gold);
    font-weight:bold;
}
</style>
</head>
