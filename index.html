
<!DOCTYPE html>
<html lang="ht">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PH Joolens Store - Free Fire Top Up</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: #0d0f17;
            color: #ffffff;
            min-height: 100vh;
            padding: 15px;
        }
        .header { 
            background: linear-gradient(135deg, #1e1b4b 0%, #312e81 100%);
            border: 1px solid rgba(99, 102, 241, 0.3);
            color: white; 
            padding: 20px 15px; 
            text-align: center; 
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(79, 70, 229, 0.2);
            margin-bottom: 20px;
        }
        .header h1 {
            font-size: 24px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #818cf8;
        }
        .header p {
            margin-top: 5px;
            font-size: 13px;
            color: #c7d2fe;
        }
        .container { 
            max-width: 500px; 
            margin: 0 auto; 
            background: #161926; 
            padding: 20px; 
            border-radius: 15px; 
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }
        .section-title { 
            font-size: 15px;
            color: #94a3b8; 
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        /* Grid Layout pou ti bouton yo */
        .product-grid { 
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px; 
            margin-bottom: 20px;
        }
        .product-card { 
            background: #1f2436;
            border: 1px solid #334155; 
            border-radius: 8px; 
            padding: 12px 8px;
            text-align: center;
            cursor: pointer; 
            transition: all 0.2s ease; 
            font-size: 13px;
            font-weight: 600;
            color: #e2e8f0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }
        .product-card:hover { 
            border-color: #6366f1;
            background: #282e47;
            transform: translateY(-2px);
        }
        .product-card.selected { 
            background: #4f46e5 !important; 
            border-color: #818cf8 !important; 
            color: #ffffff !important;
            box-shadow: 0 0 12px rgba(99, 102, 241, 0.6);
        }

        /* Pri ki afiche anba a */
        .price-display {
            background: #101420;
            border: 1px solid #1e293b;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 20px;
        }
        .price-value {
            font-size: 22px;
            font-weight: bold;
            color: #38bdf8;
        }

        .form-group { 
            margin-top: 15px; 
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #94a3b8;
            font-size: 13px;
        }
        input[type="text"] { 
            width: 100%; 
            padding: 14px; 
            border: 1px solid #334155; 
            border-radius: 8px; 
            background: #0f172a;
            color: #fff;
            font-size: 15px;
            outline: none;
            transition: 0.3s;
        }
        input[type="text"]:focus {
            border-color: #6366f1;
            box-shadow: 0 0 8px rgba(99, 102, 241, 0.4);
        }
        .btn-check { 
            display: inline-block; 
            margin-top: 8px; 
            padding: 8px 12px; 
            background: #1e293b; 
            color: #38bdf8; 
            text-decoration: none; 
            border-radius: 6px; 
            font-size: 12px; 
            border: 1px solid #334155;
            transition: 0.3s;
        }
        .btn-check:hover {
            background: #38bdf8;
            color: #0f172a;
        }
        .btn { 
            display: block; 
            width: 100%; 
            padding: 15px; 
            margin-top: 20px; 
            background: #22c55e; 
            color: white; 
            text-align: center; 
            text-decoration: none; 
            font-size: 16px; 
            border-radius: 8px; 
            font-weight: bold; 
            text-transform: uppercase;
            box-shadow: 0 4px 12px rgba(34, 197, 94, 0.3);
            transition: 0.3s;
        }
        .btn:hover { 
            background: #16a34a;
            transform: translateY(-1px);
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>PH JOOLENS STORE</h1>
        <p>Recharge Free Fire Rapide & En Toute Sécurité</p>
    </div>

    <div class="container">
        <div class="section-title">Chwazi Pake w la:</div>
        
        <div class="product-grid" id="products">
            <div class="product-card" onclick="selectProduct('110 Djamon', '150', this)">
                <span>110💎</span>
            </div>
            <div class="product-card" onclick="selectProduct('220 Djamon', '300', this)">
                <span>220💎</span>
            </div>
            <div class="product-card" onclick="selectProduct('341 Djamon', '450', this)">
                <span>341💎</span>
            </div>
            <div class="product-card" onclick="selectProduct('572 Djamon', '750', this)">
                <span>572💎</span>
            </div>
            <div class="product-card" onclick="selectProduct('1166 Djamon', '1500', this)">
                <span>1166💎</span>
            </div>
            <div class="product-card" onclick="selectProduct('Booyah Pass', '500', this)">
                <span>Booyah Pass</span>
            </div>
            <div class="product-card" onclick="selectProduct('Abonnement Semaine', '300', this)">
                <span>Abonnement semaine</span>
            </div>
            <div class="product-card" onclick="selectProduct('Abonnement Mois', '1200', this)">
                <span>Abonnement mois</span>
            </div>
        </div>

        <div class="price-display">
            <span style="font-size: 12px; color: #64748b;">PRI PAKE A:</span><br>
            <span class="price-value" id="selectedPriceDisplay">-- HTG</span>
        </div>

        <div class="form-group">
            <label for="playerId">ID Free Fire Ou An:</label>
            <input type="text" id="playerId" placeholder="Egzanp: 123456789">
            <a href="https://shop2game.com" target="_blank" class="btn-check">🔍 Verifye ID sou Garena</a>
        </div>

        <a href="#" class="btn" onclick="sendOrder()">Kòmande sou WhatsApp</a>
    </div>

    <script>
        let selectedPackage = "";
        let selectedPrice = "";

        function selectProduct(pack, price, element) {
            selectedPackage = pack;
            selectedPrice = price;
            
            // Chagrin koulè seleksyon an
            let cards = document.querySelectorAll('.product-card');
            cards.forEach(c => c.classList.remove('selected'));
            element.classList.add('selected');

            // Afiche pri a anba a
            document.getElementById('selectedPriceDisplay').innerText = price + " HTG";
        }

        function sendOrder() {
            let playerId = document.getElementById("playerId").value.trim();
            
            if (selectedPackage === "") {
                alert("Tanpri klike sou yon pake djamon anvan.");
                return;
            }
            if (playerId === "") {
                alert("Tanpri mete ID Free Fire ou an.");
                return;
            }
            
            let idPattern = /^[0-9]{8,12}$/;
            if (!idPattern.test(playerId)) {
                alert("ID Free Fire a dwe gen sèlman chif (ant 8 ak 12 chif). Tanpri tcheke l byen!");
                return;
            }

            let phone = "50937625253";
            let message = `Bonjou PH Joolens Store! Mwen vle achte: %0A%0A📦 Pake: ${selectedPackage} %0A💰 Pri: ${selectedPrice} HTG %0A🎮 ID Mwen: ${playerId}`;
            
            let whatsappUrl = `https://wa.me/${phone}?text=${message}`;
            window.location.href = whatsappUrl;
        }
    </script>
</body>
</html>
